<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوال مهم ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #2b1a2e, #1a0f1e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 3rem 2.5rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 182, 193, 0.2);
            border: 1px solid rgba(255, 182, 193, 0.15);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.4rem;
            color: #ffb6c1;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.4);
            margin-bottom: 2rem;
            letter-spacing: 1px;
            font-weight: 600;
            line-height: 1.4;
        }

        h1 span {
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); text-shadow: 0 0 30px #ffb6c1; }
            100% { transform: scale(1); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            position: relative;
            min-height: 80px;
        }

        .btn {
            padding: 0.9rem 2.8rem;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
            background: white;
            color: #1a0f1e;
            min-width: 120px;
            letter-spacing: 1px;
            position: relative;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .btn-yes {
            background: #ffb6c1;
            color: #1a0f1e;
            box-shadow: 0 8px 0 #8b5a66;
        }
        .btn-yes:hover {
            background: #ffccd5;
            transform: scale(1.05);
            box-shadow: 0 8px 0 #8b5a66;
        }

        .btn-no {
            background: #3d2c3f;
            color: #f0e6ed;
            box-shadow: 0 8px 0 #1f141f;
            transition: all 0.2s ease;
        }
        .btn-no:hover {
            background: #4f3a52;
            transform: scale(1.02);
        }

        .btn-no.move {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .turtle-container {
            margin-top: 2.5rem;
            padding: 1rem;
            background: #0d0a0e;
            border-radius: 28px;
            border: 1px solid rgba(255, 182, 193, 0.2);
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
        }

        .turtle-container.active {
            display: flex;
        }

        .turtle-container canvas {
            width: 100%;
            height: 420px;
            border-radius: 18px;
            background: #0d0a0e;
        }

        .turtle-label {
            color: #ffb6c1;
            font-size: 1rem;
            margin-top: 0.8rem;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .footnote {
            margin-top: 2rem;
            color: #6a526b;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,182,193,0.08);
            padding-top: 1.5rem;
        }

        @media (max-width: 480px) {
            .card { padding: 2rem 1.2rem; }
            h1 { font-size: 1.8rem; }
            .btn { padding: 0.7rem 1.5rem; font-size: 1.4rem; min-width: 90px; }
            .btn-group { gap: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>
        <span>❣️</span> دوست دخترم میشی؟ <span>❣️</span>
    </h1>

    <div class="btn-group" id="btnGroup">
        <button class="btn btn-yes" id="yesBtn">اره 💖</button>
        <button class="btn btn-no" id="noBtn">نه 😤</button>
    </div>

    <div class="turtle-container" id="turtleContainer">
        <canvas id="heartCanvas"></canvas>
        <div class="turtle-label">✨ قلب‌های من برای تو ✨</div>
    </div>

    <div class="footnote">💕 جوابتو با دقت انتخاب کن 💕</div>
</div>

<script>
    (function() {
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const btnGroup = document.getElementById('btnGroup');
        const turtleContainer = document.getElementById('turtleContainer');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // تنظیم اندازه canvas
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const width = rect.width - 32;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = 420 * window.devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = '420px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        // تابع رسم قلب
        function drawHeart() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            
            ctx.clearRect(0, 0, w, h);
            
            const centerX = w / 2;
            const centerY = h / 2 - 10;

            // رسم قلب با نقاط
            for (let scale = 11; scale <= 16; scale++) {
                for (let i = 0; i < 120; i++) {
                    const angle = i * (Math.PI * 2) / 120;
                    const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
                    const y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 
                              2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;
                    
                    const px = centerX + x;
                    const py = centerY - y;
                    
                    ctx.beginPath();
                    ctx.arc(px, py, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffb6c1';
                    ctx.shadowColor = '#ffb6c1';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                }
            }
        }

        // تابع جابه‌جایی دکمه "نه"
        function moveNoButton() {
            const groupRect = btnGroup.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const padding = 20;
            const maxX = groupRect.width - btnRect.width - padding;
            const maxY = groupRect.height - btnRect.height - padding;

            const randomX = Math.max(0, Math.random() * maxX);
            const randomY = Math.max(0, Math.random() * maxY);

            noBtn.style.position = 'relative';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.classList.add('move');
        }

        // وقتی دکمه "نه" کلیک شد
        noBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            moveNoButton();
        });

        // هاور روی "نه"
        noBtn.addEventListener('mouseenter', function() {
            if (Math.random() > 0.5) {
                moveNoButton();
            }
        });

        // وقتی دکمه "اره" کلیک شد
        yesBtn.addEventListener('click', function() {
            turtleContainer.classList.add('active');
            
            // با تاخیر کوچک canvas رو رسم کن
            setTimeout(() => {
                resizeCanvas();
                drawHeart();
            }, 100);

            yesBtn.disabled = true;
            noBtn.disabled = true;
            yesBtn.style.opacity = '0.6';
            noBtn.style.opacity = '0.5';
            noBtn.style.cursor = 'default';

            noBtn.style.left = '0px';
            noBtn.style.top = '0px';
            noBtn.style.position = 'static';

            setTimeout(() => {
                turtleContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);

            btnGroup.style.transition = 'opacity 0.5s';
            btnGroup.style.opacity = '0.7';
        });

        yesBtn.addEventListener('mouseenter', function() {
            if (!yesBtn.disabled) {
                this.style.transform = 'scale(1.07)';
            }
        });
        yesBtn.addEventListener('mouseleave', function() {
            if (!yesBtn.disabled) {
                this.style.transform = 'scale(1)';
            }
        });

        noBtn.style.position = 'static';

        noBtn.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            moveNoButton();
        });

        // وقتی صفحه لود شد، canvas رو آماده کن
        window.addEventListener('load', function() {
            resizeCanvas();
            // یه قلب کوچک برای پیش‌نمایش (اختیاری)
            // drawHeart(); // اگر میخواید همیشه نمایش داده بشه، این خط رو فعال کنید
        });

        // وقتی پنجره resize بشه
        window.addEventListener('resize', function() {
            if (turtleContainer.classList.contains('active')) {
                resizeCanvas();
                drawHeart();
            }
        });

    })();
</script>

</body>
</html>
